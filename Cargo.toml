[package]
name = "forge-tools-image-viewer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "image_viewer"
path = "src/main.rs"

[dependencies]
eyre = "0.6.12"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
ndarray = "0.17.2"
arrow-array = "54.3.1"
dora-node-api = "0.4.1"
forge_msgs = { git = "https://gitlab.ex-ai.cn/meta-emt/framework/forge.git", package = "forge_msgs", branch = "dev" }
eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
ctrlc = { version = "3.5.2", features = ["termination"] }
