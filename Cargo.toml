[package]
name = "forge-tools-image-viewer"
version = "2.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "Dora image stream viewer for Forge robotics dataflows."
license = "Apache-2.0"
authors = ["X-ERA"]
readme = "README.md"
keywords = ["dora", "egui", "image", "robotics", "viewer"]
categories = ["multimedia::images", "visualization"]
repository = "https://github.com/Forgelab-Robotics/adapter-viewer-image"
homepage = "https://github.com/Forgelab-Robotics/adapter-viewer-image"
documentation = "https://github.com/Forgelab-Robotics/adapter-viewer-image#readme"
publish = false

[[bin]]
name = "image_viewer"
path = "src/main.rs"

[dependencies]
arrow-array = "59.1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dora-node-api = { version = "1", features = ["arrow-v59"] }
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "wgpu", "x11"] }
eyre = "0.6.12"
forge_msgs = "2.0.0"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
