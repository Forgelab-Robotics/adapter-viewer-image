name: Build Ubuntu 20.04 binary

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: v1.0.2
      version:
        description: Image viewer version without the v prefix
        required: true
        default: 1.0.2

permissions:
  contents: read

jobs:
  build:
    name: Build Ubuntu 20.04 (${{ matrix.asset_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_arch: x86_64
            machine: Advanced Micro Devices X86-64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_arch: arm64
            machine: AArch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:20.04
    env:
      LC_ALL: C
      RELEASE_VERSION: ${{ inputs.version }}
      TARGET: ${{ matrix.target }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - name: Install system tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            libgl1-mesa-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - name: Build and package release binary
        run: bash scripts/package_release.sh

      - name: Verify and package archive
        run: |
          test "${{ inputs.ref }}" = "v${RELEASE_VERSION}"
          ./dist/image_viewer --version | tee /tmp/version.txt
          grep -q "${RELEASE_VERSION}" /tmp/version.txt
          file ./dist/image_viewer | grep -q 'ELF 64-bit LSB'
          readelf -h ./dist/image_viewer |
            grep -Eq "^[[:space:]]*Machine:[[:space:]]*${EXPECTED_MACHINE}[[:space:]]*$"
          test -z "$(ldd ./dist/image_viewer | grep 'not found' || true)"
          max_glibc="$(objdump -T ./dist/image_viewer |
            grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)"
          echo "max glibc symbol version: ${max_glibc}"
          test "$(printf '%s\n' '2.31' "${max_glibc#GLIBC_}" |
            sort -V | tail -1)" = "2.31"
          if strings ./dist/image_viewer |
            grep -E '/home/|gitlab\.ex-ai\.cn|git\+ssh://|ssh://'; then
            echo "ERROR: private build markers found in binary" >&2
            exit 1
          fi
          ldd --version | sed -n '1p'
          archive="image_viewer-v${RELEASE_VERSION}-ubuntu20.04-${ASSET_ARCH}.tar.gz"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -czf "${archive}" \
            image_viewer
          sha256sum "${archive}" > "${archive}.sha256"
          test "$(tar -tzf "${archive}")" = "image_viewer"
          sha256sum --check "${archive}.sha256"
          clean_runtime="/tmp/image-viewer-clean-runtime-${ASSET_ARCH}"
          rm -rf "${clean_runtime}"
          mkdir -p "${clean_runtime}"
          tar -xzf "${archive}" -C "${clean_runtime}"
          env -i HOME="${clean_runtime}" PATH=/usr/bin:/bin \
            "${clean_runtime}/image_viewer" --version | grep -q "${RELEASE_VERSION}"
          rm -rf "${clean_runtime}"

      - uses: actions/upload-artifact@v6
        with:
          name: image_viewer-v${{ inputs.version }}-ubuntu20.04-${{ matrix.asset_arch }}
          path: |
            image_viewer-v${{ inputs.version }}-ubuntu20.04-${{ matrix.asset_arch }}.tar.gz
            image_viewer-v${{ inputs.version }}-ubuntu20.04-${{ matrix.asset_arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
